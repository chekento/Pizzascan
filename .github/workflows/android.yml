name: Build and verify PizzaScan for Google Play
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle web assets and run tests
        run: |
          npm ci --ignore-scripts --no-audit
          npm run assets
          npm test
          mkdir -p test-results
          cp package-lock.json test-results/package-lock.json
          tar -czf test-results/web-bundle.tar.gz web
          npx playwright install --with-deps chromium
          npm run smoke
          npm run map-smoke
          npm run live-map
      - name: Render Play Store assets
        run: node scripts/store-assets.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PizzaScan-Web-Tests
          path: test-results/
          retention-days: 30
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned web dependencies and bundle assets
        run: |
          npm ci --ignore-scripts --no-audit
          npm run assets
          npm test
          node --check web/script.js
          node --check web/hotfix-map.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK, instrumented tests and Android lint
        run: |
          node scripts/download-test-photo.cjs
          gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug assembleRelease bundleRelease lintRelease
      - name: Verify and collect the APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/PizzaScan-2.2.0-hotfix1-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/PizzaScan-2.2.0-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/PizzaScan-2.2.0-unsigned.aab
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/PizzaScan-2.2.0-hotfix1-debug.apk > artifacts/hotfix1-debug-signature.txt
          cp "$BUILD_TOOLS/lib/apksigner.jar" artifacts/apksigner.jar
          "$BUILD_TOOLS/aapt" dump badging artifacts/PizzaScan-2.2.0-hotfix1-debug.apk > artifacts/hotfix1-debug-apk-info.txt
          "$BUILD_TOOLS/aapt" dump badging artifacts/PizzaScan-2.2.0-unsigned.apk > artifacts/apk-info.txt
          sha256sum artifacts/PizzaScan-2.2.0-hotfix1-debug.apk > artifacts/HOTFIX1-SHA256.txt
          sha256sum artifacts/PizzaScan-2.2.0-unsigned.* > artifacts/SHA256SUMS.txt
          curl --fail --location --retry 2 --output artifacts/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  artifacts/bundletool.jar' | sha256sum -c -
          java -jar artifacts/bundletool.jar validate --bundle=artifacts/PizzaScan-2.2.0-unsigned.aab > artifacts/bundle-validation.txt
          java -jar artifacts/bundletool.jar dump manifest --bundle=artifacts/PizzaScan-2.2.0-unsigned.aab > artifacts/bundle-manifest.xml
          cp package-lock.json artifacts/package-lock.json
          tar -czf artifacts/web-bundle.tar.gz web
      - name: Upload APK for private final signing
        uses: actions/upload-artifact@v4
        with:
          name: PizzaScan-Build
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PizzaScan-Test-Reports
          path: |
            test-results/
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 30

  models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model: [clip32, clip16, siglip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser model runtime
        run: |
          npm ci --ignore-scripts --no-audit
          npm run assets
          npx playwright install --with-deps chromium
      - name: Real model inference, offline cache and negative image
        env:
          MODEL: ${{ matrix.model }}
        run: npm run models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PizzaScan-Model-${{ matrix.model }}
          path: test-results/
          retention-days: 30
