name: Publish direct PizzaScan APK

on:
  push:
    branches: [publish-apk-direct-download]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare bundled web assets
        run: |
          npm ci --ignore-scripts --no-audit
          npm run assets
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        run: |
          gradle --no-daemon assembleDebug lintDebug
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PizzaScan-latest-test.apk
          sha256sum release/PizzaScan-latest-test.apk > release/PizzaScan-latest-test-SHA256.txt
      - name: Publish stable GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-test >/dev/null 2>&1; then
            gh release create latest-test --title "PizzaScan latest tested APK" --notes "Installable Android test build from the device-validated PizzaScan branch. Package: cloud.kosch.pizzascan.search1. The Google Play release uses cloud.kosch.pizzascan."
          fi
          gh release upload latest-test release/PizzaScan-latest-test.apk release/PizzaScan-latest-test-SHA256.txt --clobber
