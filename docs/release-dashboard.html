<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e94e27">
<title>PizzaScan · Release-Status</title>
<style>
:root{--brand:#e94e27;--brand2:#ff7a3d;--ink:#211b18;--muted:#746a66;--line:#eadfd8;--ok:#177a45;--shadow:0 18px 55px rgba(72,42,27,.15)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#ffe8db 0,transparent 34%),linear-gradient(180deg,#fff8f3,#fff)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.dash{width:min(980px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:17px 18px;background:linear-gradient(135deg,#fff,#fff5ef)}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));font-size:22px}
.titles{min-width:0;flex:1}.titles b{display:block;font-size:16px}.titles span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.actions{display:flex;gap:7px;align-items:center}
.btn,.language{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;color:inherit}.btn.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}.language{font-size:12px;max-width:145px}
.body{padding:16px 18px 18px}.notice{border:1px solid #ffc6ae;background:linear-gradient(135deg,#fff3ec,#fffaf7);border-radius:17px;padding:14px;margin-bottom:16px}.notice b{display:block;margin-bottom:6px}.notice p{margin:0;color:#6b4a3e;font-size:13px;line-height:1.55}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links .btn{font-size:12px}.summary{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:14px}.phase{font-size:13px;color:var(--muted)}.score{font-weight:900;font-size:28px}.bar{height:10px;border-radius:999px;background:#f2ebe7;overflow:hidden;margin:9px 0 16px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:inherit}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff}.item .top{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}.item b{font-size:13px}.item p{font-size:12px;line-height:1.5;color:var(--muted);margin:7px 0 0}.item p.status{color:var(--ok);font-weight:800}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}a{color:var(--brand);font-weight:800;text-decoration:none}.error{padding:14px;border-radius:14px;background:#fff1ed;color:#8c2f1b;font-size:13px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-wrap:wrap}.actions{width:100%;justify-content:space-between}.summary{grid-template-columns:1fr}.score{font-size:24px}}
[dir=rtl] .head,[dir=rtl] .summary,[dir=rtl] .foot{direction:rtl}
</style>
</head>
<body>
<div class="wrap"><main class="dash" id="dash">
<header class="head"><div class="logo" aria-hidden="true">🍕</div><div class="titles"><b id="title">PizzaScan · Release-Status</b><span id="subtitle">2.3.23 · Build 58</span></div><div class="actions"><select class="language" id="language"></select><button class="btn" id="full" type="button">Vollansicht</button></div></header>
<div class="body" id="body"><p>Release-Status wird geladen …</p></div>
</main></div>
<script>
'use strict';
const KEY='pizzascan-language-v1';
const supported=['de','en','it','es','fr','pt','nl','pl','tr','ru','ja','zh','ko','ar'];
const names={de:'Deutsch',en:'English',it:'Italiano',es:'Español',fr:'Français',pt:'Português',nl:'Nederlands',pl:'Polski',tr:'Türkçe',ru:'Русский',ja:'日本語',zh:'中文',ko:'한국어',ar:'العربية'};
const rtl=new Set(['ar']);
const copy={
 de:{title:'PizzaScan · Release-Status',subtitle:'2.3.23 · Build 58 · 14 Sprachen',note:'Die direkt installierbare Build-58-APK ist veröffentlicht. Der Google-Play-Test bleibt ein separater Vertriebskanal.',phase:'Veröffentlicht am',done:'Erledigt',open:'APK herunterladen',checksum:'SHA-256',changelog:'Changelog',archive:'APK-Archiv',repo:'Repository',full:'Vollansicht',back:'Zurück',error:'Release-Status konnte nicht geladen werden.'},
 en:{title:'PizzaScan · Release status',subtitle:'2.3.23 · Build 58 · 14 languages',note:'The directly installable Build 58 APK is published. Google Play testing remains a separate distribution channel.',phase:'Published',done:'Done',open:'Download APK',checksum:'SHA-256',changelog:'Changelog',archive:'APK archive',repo:'Repository',full:'Full view',back:'Back',error:'Release status could not be loaded.'},
 it:{title:'PizzaScan · Stato della release',subtitle:'2.3.23 · Build 58 · 14 lingue',note:'L’APK Build 58 installabile direttamente è pubblicato. Il test Google Play resta un canale separato.',phase:'Pubblicato il',done:'Completato',open:'Scarica APK',checksum:'SHA-256',changelog:'Changelog',archive:'Archivio APK',repo:'Repository',full:'Vista completa',back:'Indietro',error:'Impossibile caricare lo stato della release.'},
 es:{title:'PizzaScan · Estado de la versión',subtitle:'2.3.23 · Build 58 · 14 idiomas',note:'El APK Build 58 instalable directamente está publicado. La prueba de Google Play sigue siendo un canal separado.',phase:'Publicado el',done:'Completado',open:'Descargar APK',checksum:'SHA-256',changelog:'Registro de cambios',archive:'Archivo de APK',repo:'Repositorio',full:'Vista completa',back:'Atrás',error:'No se pudo cargar el estado de la versión.'},
 fr:{title:'PizzaScan · État de la version',subtitle:'2.3.23 · Build 58 · 14 langues',note:'L’APK Build 58 directement installable est publiée. Le test Google Play reste un canal distinct.',phase:'Publié le',done:'Terminé',open:'Télécharger l’APK',checksum:'SHA-256',changelog:'Journal des modifications',archive:'Archive APK',repo:'Dépôt',full:'Vue complète',back:'Retour',error:'Impossible de charger l’état de la version.'},
 pt:{title:'PizzaScan · Estado da versão',subtitle:'2.3.23 · Build 58 · 14 idiomas',note:'O APK Build 58 instalável diretamente está publicado. O teste Google Play continua a ser um canal separado.',phase:'Publicado em',done:'Concluído',open:'Baixar APK',checksum:'SHA-256',changelog:'Registo de alterações',archive:'Arquivo APK',repo:'Repositório',full:'Vista completa',back:'Voltar',error:'Não foi possível carregar o estado da versão.'},
 nl:{title:'PizzaScan · Release-status',subtitle:'2.3.23 · Build 58 · 14 talen',note:'De direct installeerbare Build 58-APK is gepubliceerd. De Google Play-test blijft een apart distributiekanaal.',phase:'Gepubliceerd op',done:'Voltooid',open:'APK downloaden',checksum:'SHA-256',changelog:'Changelog',archive:'APK-archief',repo:'Repository',full:'Volledige weergave',back:'Terug',error:'Release-status kon niet worden geladen.'},
 pl:{title:'PizzaScan · Status wydania',subtitle:'2.3.23 · Build 58 · 14 języków',note:'Bezpośrednio instalowalny APK Build 58 jest opublikowany. Test Google Play pozostaje osobnym kanałem dystrybucji.',phase:'Opublikowano',done:'Gotowe',open:'Pobierz APK',checksum:'SHA-256',changelog:'Dziennik zmian',archive:'Archiwum APK',repo:'Repozytorium',full:'Pełny widok',back:'Wstecz',error:'Nie udało się wczytać statusu wydania.'},
 tr:{title:'PizzaScan · Sürüm durumu',subtitle:'2.3.23 · Build 58 · 14 dil',note:'Doğrudan kurulabilir Build 58 APK yayımlandı. Google Play testi ayrı bir dağıtım kanalıdır.',phase:'Yayımlandı',done:'Tamamlandı',open:'APK indir',checksum:'SHA-256',changelog:'Değişiklik günlüğü',archive:'APK arşivi',repo:'Depo',full:'Tam görünüm',back:'Geri',error:'Sürüm durumu yüklenemedi.'},
 ru:{title:'PizzaScan · Статус релиза',subtitle:'2.3.23 · Build 58 · 14 языков',note:'Опубликован непосредственно устанавливаемый APK Build 58. Тестирование Google Play остаётся отдельным каналом.',phase:'Опубликовано',done:'Готово',open:'Скачать APK',checksum:'SHA-256',changelog:'Журнал изменений',archive:'Архив APK',repo:'Репозиторий',full:'Полный вид',back:'Назад',error:'Не удалось загрузить статус релиза.'},
 ja:{title:'PizzaScan · リリース状況',subtitle:'2.3.23 · Build 58 · 14言語',note:'直接インストールできるBuild 58 APKを公開しました。Google Playテストは別の配布経路です。',phase:'公開日',done:'完了',open:'APKをダウンロード',checksum:'SHA-256',changelog:'変更履歴',archive:'APKアーカイブ',repo:'リポジトリ',full:'全画面',back:'戻る',error:'リリース状況を読み込めませんでした。'},
 zh:{title:'PizzaScan · 发布状态',subtitle:'2.3.23 · Build 58 · 14种语言',note:'可直接安装的 Build 58 APK 已发布。Google Play 测试仍是独立的分发渠道。',phase:'发布日期',done:'已完成',open:'下载 APK',checksum:'SHA-256',changelog:'更新日志',archive:'APK 存档',repo:'代码仓库',full:'完整视图',back:'返回',error:'无法加载发布状态。'},
 ko:{title:'PizzaScan · 릴리스 상태',subtitle:'2.3.23 · Build 58 · 14개 언어',note:'직접 설치 가능한 Build 58 APK가 공개되었습니다. Google Play 테스트는 별도의 배포 채널입니다.',phase:'게시일',done:'완료',open:'APK 다운로드',checksum:'SHA-256',changelog:'변경 로그',archive:'APK 아카이브',repo:'저장소',full:'전체 보기',back:'뒤로',error:'릴리스 상태를 불러오지 못했습니다.'},
 ar:{title:'PizzaScan · حالة الإصدار',subtitle:'2.3.23 · Build 58 · 14 لغة',note:'تم نشر APK Build 58 القابل للتثبيت مباشرة. يظل اختبار Google Play قناة توزيع منفصلة.',phase:'تاريخ النشر',done:'مكتمل',open:'تنزيل APK',checksum:'SHA-256',changelog:'سجل التغييرات',archive:'أرشيف APK',repo:'المستودع',full:'العرض الكامل',back:'رجوع',error:'تعذر تحميل حالة الإصدار.'}
};
let data=null,active='';
function normalize(value){const raw=String(value||'').trim().toLowerCase().replace('_','-');const base=raw.split('-')[0];return supported.includes(raw)?raw:(supported.includes(base)?base:'')}
function detect(){for(const value of [...(navigator.languages||[]),navigator.language||'']){const code=normalize(value);if(code)return code}return'de'}
function readLanguage(){try{return normalize(localStorage.getItem(KEY))||detect()}catch{return detect()}}
function text(key){return(copy[active]||copy.en)[key]||copy.en[key]}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function link(url,label){return'<a class="btn primary" href="'+esc(url)+'">'+label+'</a>'}
function itemLabel(id,label){const labels={frontpage:{de:'Repository-Frontpage',en:'Repository front page'},languages:{de:'Web- und App-Sprachen',en:'Web and app languages'},runtime:{de:'Karte, GPS und Live-Bewertung',en:'Map, GPS and live rating'},apk:{de:'Installierbare APK',en:'Installable APK'},archive:{de:'Release-Historie',en:'Release history'}};return(labels[id]&&labels[id][active])||labels[id]?.en||label}
function itemNote(id,note){const notes={frontpage:{de:'README, Sprachseiten, Downloadlink, SHA-256, Changelog und Archiv zeigen gemeinsam auf 2.3.23 · Build 58.',en:'README, language pages, download link, SHA-256, changelog and archive all point to 2.3.23 · Build 58.'},languages:{de:'Vierzehn Sprachen mit automatischer Browser-/Gerätespracherkennung, Menüs, Dropdowns, Ladeanzeigen und Statusmeldungen.',en:'Fourteen languages with automatic browser/device detection, menus, dropdowns, loading indicators and status messages.'},runtime:{de:'Mini- und Vollbildkarte nutzen dieselben POIs; GPS scannt den sichtbaren Ausschnitt; alle Bewertungsanzeigen teilen einen Live-Wert.',en:'Mini and fullscreen maps use the same POIs; GPS scans the visible area; every rating display shares one live value.'},apk:{de:'PizzaScan-2.3.23.apk · versionCode 58 · SHA-256 d08a3c…03bf2.',en:'PizzaScan-2.3.23.apk · versionCode 58 · SHA-256 d08a3c…03bf2.'},archive:{de:'2.3.22 und ältere APKs bleiben im Archiv für Regression und Gerätevergleiche verfügbar.',en:'2.3.22 and older APKs remain archived for regression and device comparisons.'}};return(notes[id]&&notes[id][active])||notes[id]?.en||note}
function render(){document.documentElement.lang=active;document.documentElement.dir=rtl.has(active)?'rtl':'ltr';document.title=text('title');document.getElementById('title').textContent=text('title');document.getElementById('subtitle').textContent=text('subtitle');const selector=document.getElementById('language');selector.setAttribute('aria-label',text('language')||'Language');selector.innerHTML=supported.map(code=>'<option value="'+code+'">'+names[code]+'</option>').join('');selector.value=active;document.getElementById('full').textContent=text('full');if(!data)return;const pct=Math.round((Number(data.completed)||0)/(Number(data.total)||1)*100);const cards=(data.items||[]).map(item=>'<article class="item"><div class="top"><i class="dot"></i><b>'+itemLabel(item.id,item.label)+'</b></div><p>'+itemNote(item.id,item.note)+'</p><p class="status">'+text('done')+'</p></article>').join('');document.getElementById('body').innerHTML='<section class="notice"><b>'+text('note')+'</b><p>'+text('phase')+' '+esc(data.updated)+' · '+esc(data.version)+' · Build '+esc(data.build)+'</p><div class="links">'+link(data.apk,text('open'))+link(data.checksum,text('checksum'))+link(data.changelog,text('changelog'))+link(data.archive,text('archive'))+'</div></section><section class="summary"><div><div class="phase">'+esc(data.summary)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="score">'+esc(data.completed)+'/'+esc(data.total)+'</div></section><section class="grid">'+cards+'</section><footer class="foot"><span>By KoSch · PizzaScan</span><span><a href="https://github.com/chekento/Pizzascan">'+text('repo')+'</a></span></footer>'}
document.getElementById('language').addEventListener('change',event=>{active=normalize(event.target.value)||'de';try{localStorage.setItem(KEY,active)}catch{}render()});
document.getElementById('full').addEventListener('click',async()=>{if(!document.fullscreenElement){await document.getElementById('dash').requestFullscreen?.()}else await document.exitFullscreen?.()});
async function load(){try{const response=await fetch('release-status.json',{cache:'no-store'});if(!response.ok)throw Error(response.status);data=await response.json();render()}catch{document.getElementById('body').innerHTML='<div class="error">'+text('error')+'</div>'}}
active=readLanguage();render();load();
</script>
</body>
</html>
