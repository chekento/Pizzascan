<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e94e27">
<title>PizzaScan · Google Play Release Dashboard</title>
<style>
:root{--brand:#e94e27;--brand2:#ff7a3d;--ink:#211b18;--muted:#746a66;--paper:#fff8f3;--card:#fff;--line:#eadfd8;--ok:#177a45;--work:#ad6800;--wait:#6f6470;--shadow:0 18px 55px rgba(72,42,27,.15)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#ffe8db 0,transparent 34%),linear-gradient(180deg,#fff8f3,#fff)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.dash{width:min(880px,100%);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;transition:.25s ease}.dash.mini{max-width:470px}.head{display:flex;align-items:center;gap:12px;padding:17px 18px;background:linear-gradient(135deg,#fff,#fff5ef)}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));font-size:22px}.titles{min-width:0;flex:1}.titles b{display:block;font-size:16px}.titles span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}.body{padding:16px 18px 18px}.dash.mini .body{display:none}.summary{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:14px}.phase{font-size:13px;color:var(--muted)}.score{font-weight:900;font-size:28px;letter-spacing:-.04em}.bar{height:10px;border-radius:999px;background:#f2ebe7;overflow:hidden;margin:9px 0 16px}.bar>i{display:block;height:100%;width:37.5%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff}.item .top{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%}.done .dot{background:var(--ok)}.in_progress .dot{background:var(--work)}.pending .dot{background:var(--wait)}.item b{font-size:13px}.item p{font-size:12px;line-height:1.5;color:var(--muted);margin:7px 0 0}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:12px}.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}a{color:var(--brand);font-weight:800;text-decoration:none}.error{padding:14px;border-radius:14px;background:#fff1ed;color:#8c2f1b;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.actions{flex-direction:column}.summary{grid-template-columns:1fr}.score{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<section class="dash" id="dash" aria-live="polite">
<header class="head">
<div class="logo">🍕</div>
<div class="titles"><b>PizzaScan · Google Play Release</b><span id="headSub">Status wird geladen …</span></div>
<div class="actions"><button class="btn" id="miniBtn" type="button">Minimieren</button><button class="btn primary" id="maxBtn" type="button">Vollansicht</button></div>
</header>
<div class="body" id="body"><div class="phase">Release-Status wird geladen …</div></div>
</section>
</div>
<script>
'use strict';
const dash=document.getElementById('dash'),body=document.getElementById('body'),headSub=document.getElementById('headSub');
const miniBtn=document.getElementById('miniBtn'),maxBtn=document.getElementById('maxBtn');
function statusText(s){return s==='done'?'Erledigt':s==='in_progress'?'In Arbeit':'Ausstehend'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){try{const r=await fetch('release-status.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const pct=Math.round((Number(d.completed)||0)/(Number(d.total)||1)*100);headSub.textContent=`v${d.version} · ${d.summary}`;body.innerHTML=`<div class="summary"><div><div class="phase">Phase: <strong>${esc(d.stage)}</strong> · Stand ${esc(d.updated)}</div><div class="bar" title="${pct}% erledigt"><i style="width:${pct}%"></i></div><div class="legend"><span>● Erledigt</span><span>● In Arbeit</span><span>● Ausstehend</span></div></div><div class="score">${esc(d.completed)}/${esc(d.total)}</div></div><div class="grid">${(d.items||[]).map(x=>`<article class="item ${esc(x.status)}"><div class="top"><i class="dot"></i><b>${esc(x.label)}</b></div><p>${esc(x.note)}</p><p><strong>${statusText(x.status)}</strong></p></article>`).join('')}</div><div class="foot"><span>By KoSch · PizzaScan</span><span><a href="https://github.com/chekento/Pizzascan">Repository</a> · <a href="../store/PLAY-CONSOLE.md">Play-Checkliste</a></span></div>`}catch(e){body.innerHTML='<div class="error">Release-Status konnte nicht geladen werden. Öffne das Dashboard bitte über die Repository-Preview, nicht als lokale Datei.</div>';headSub.textContent='Status nicht verfügbar'}}
miniBtn.addEventListener('click',()=>{dash.classList.toggle('mini');miniBtn.textContent=dash.classList.contains('mini')?'Öffnen':'Minimieren'});
maxBtn.addEventListener('click',async()=>{if(!document.fullscreenElement){await dash.requestFullscreen?.();maxBtn.textContent='Zurück'}else{await document.exitFullscreen?.();maxBtn.textContent='Vollansicht'}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)maxBtn.textContent='Vollansicht'});
load();
</script>
</body>
</html>
