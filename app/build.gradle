plugins { id 'com.android.application' }

android {
    namespace 'cloud.kosch.pizzascan'
    compileSdk 36
    defaultConfig {
        applicationId 'cloud.kosch.pizzascan'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '2.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets { main { assets.srcDirs = ['../web'] } }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('verifyWebAssets') {
    doLast {
        ['index.html', 'script.js', 'core.js', 'style.css',
         'vendor/leaflet/leaflet.js', 'vendor/leaflet/leaflet.css',
         'analysis.js', 'model-info.js', 'places.js', 'map-ui.js', 'vendor/hours.js', 'vendor/ai-worker.js', 'review-builder.js', 'review-ui.js', 'privacy-ui.js', 'privacy.html'].each { name ->
            if (!file("../web/$name").isFile()) {
                throw new GradleException("Missing web/$name. Run npm install and npm run assets first.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }
