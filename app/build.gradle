plugins { id 'com.android.application' }

android {
    namespace 'cloud.kosch.pizzascan'
    compileSdk 36
    defaultConfig {
        applicationId 'cloud.kosch.pizzascan'
        minSdk 26
        targetSdk 36
        // Build 44: WebSim-first fast Pizza/Italian discovery and compact map controls.
        versionCode 44
        versionName '2.3.9'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets { main { assets.srcDirs = ['../web'] } }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            applicationIdSuffix '.lang1'
            versionNameSuffix '-lang1'
        }
        release { minifyEnabled false }
        direct {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('verifyWebAssets') {
    doLast {
        ['index.html', 'script.js', 'core.js', 'style.css',
         'hotfix-map.js', 'hotfix-map.css', 'persistent-model-ui.js', 'search-ui.js', 'search-ui.css', 'settings-search.js', 'review-discovery.js', 'broad-defaults.js', 'poi-discovery.js', 'pizza-only.js', 'smart-discovery.js', 'place-history.js', 'runtime-finalize.js', 'open-reviews-publish.js', 'build39-runtime.js', 'build40-runtime.js', 'build41-hardening.js', 'build42-discovery.js', 'build42-release.js', 'build44-websim.js', 'build44-websim.css', 'build41-hardening.css', 'poi-search.js', 'native-overpass.js', 'release-info.js', 'google-reviews.js', 'google-reviews.css', 'i18n.js', 'i18n-extra.js', 'i18n.css', 'i18n-shim.js', 'i18n-content.js', 'i18n-static.js',
         'vendor/leaflet/leaflet.js', 'vendor/leaflet/leaflet.css',
         'analysis.js', 'model-info.js', 'ratings.js', 'ratings-ui.js', 'places.js', 'map-ui.js', 'vendor/hours.js', 'vendor/ai-worker.js', 'review-builder.js', 'draft-store.js', 'draft-list.js', 'review-ui.js', 'privacy-ui.js', 'privacy-233.js', 'privacy.html', 'geocoder-proxy.html', 'geocoder-proxy.js'].each { name ->
            if (!file("../web/$name").isFile()) {
                throw new GradleException("Missing web/$name. Run npm install and npm run assets first.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }
